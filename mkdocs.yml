site_name: "CSCI 435/535 — Software Engineering (William & Mary — Fall 2026)"
site_description: "William & Mary CSCI 435/535: Software Engineering"
site_url: https://csci-435-se.github.io/
repo_url: https://github.com/CSCI-435-SE
repo_name: CSCI-435-SE

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Schedule: schedule.md
  - Projects: projects.md
  - Sprints:
    - Overview: sprints.md
    - Sprint 0: sprint0.md
    - Sprint 1: sprint1.md
    - Sprint 2: sprint2.md
    - Sprint 3: sprint3.md
    - Sprint 4: sprint4.md
    - AI Log Instructions: ai-logs.md
  - Presentations: presentations.md
  - Resources: resources.md
  - Glossary: glossary.md

theme:
  name: material
  font:
    text: Nunito Sans
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css?v=5

extra_javascript:
  - javascripts/extra.js?v=1

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      title: On This Page
      permalink: true

plugins:
  - search
  # Password-protection is installed and ready to use, but not applied to any page yet.
  # To protect a page: add `encrypted: true` and a `password: <value>` to that page's
  # front matter (top of the .md file, between --- lines). See:
  # https://github.com/vsalvino/mkdocs-encryptcontent
  - encryptcontent:
      title_prefix: '[Protected]'
      summary: 'This content is password protected.'
      placeholder: 'Enter the password, then press Enter'
      decryption_failure_message: 'Invalid password'
      encryption_info_message: 'This page is password protected. Please enter the password provided by the instructor.'
